workflows:
  ios-release:
    name: Virtual Life iOS App Store Release
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: reelcraft
    environment:
      groups:
        - appstore_credentials
      vars:
        APP_BUNDLE_ID: "com.virtuallife.simulator"
      node: latest
      xcode: latest
    scripts:
      - name: Install Node.js dependencies
        script: |
          npm install --legacy-peer-deps
      - name: Build Web Assets & Capacitor Sync
        script: |
          npm run build
          npx cap sync ios
          cd ios/App && pod install || true
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$APP_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Increment and set build number
        script: |
          cd ios/App
          NEW_BUILD=$(($PROJECT_BUILD_NUMBER + 100))
          echo "Setting iOS build number to $NEW_BUILD"
          agvtool new-version -all $NEW_BUILD
      - name: Build iOS Xcode App
        script: |
          xcode-project build-ipa \
            --workspace "ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
